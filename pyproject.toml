[project]
name = "toplogical-interview"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yusuf ridwan", email = "horiyorrmi72@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt<4.0",
    "email-validator>=2.3.0",
    "fastapi>=0.140.13",
    "passlib>=1.7.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "reportlab>=5.0.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[project.scripts]
toplogical-interview = "toplogical_interview:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
